<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Troy Clarke Headquarters</title>
    <script>
      // Set the theme before React mounts, to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem("tchq-theme");
          var theme = stored === "light" || stored === "dark" || stored === "monet" ? stored : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body class="bg-[var(--bg-from)] text-[var(--text-primary)] transition-colors duration-500">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
