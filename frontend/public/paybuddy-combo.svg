<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#5b21b6"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="400" height="225" fill="url(#bg)"/>
  <circle cx="350" cy="200" r="80" fill="#ffffff" opacity="0.07"/>
  <circle cx="40" cy="20" r="70" fill="#0f172a" opacity="0.10"/>
  <circle cx="70" cy="180" r="40" fill="#ffffff" opacity="0.06"/>

  <g filter="url(#ds)">
    <!-- wallet / card -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
      <rect x="120" y="80" width="130" height="85" rx="12"/>
      <path d="M210 118 h40 a10 10 0 0 1 0 20 h-40 a10 10 0 0 1 0 -20 z"/>
      <circle cx="230" cy="128" r="3.5" fill="#ffffff" stroke="none"/>
    </g>

    <!-- exchange arrows, stamped directly over the card -->
    <g stroke="#ffffff" stroke-opacity="0.97" stroke-width="10" stroke-linecap="round">
      <line x1="152" y1="110" x2="206" y2="110"/>
      <line x1="218" y1="134" x2="164" y2="134"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.97">
      <path d="M206 100 l16 10 l-16 10 z"/>
      <path d="M164 124 l-16 10 l16 10 z"/>
    </g>
  </g>
</svg>
