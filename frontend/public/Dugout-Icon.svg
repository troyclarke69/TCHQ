<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225">
  <!-- Dugout - same background concept as ClaimLens / portfolio logos -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#052e16"/>
      <stop offset="0.55" stop-color="#166534"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="400" height="225" fill="url(#bg)"/>
  <circle cx="60" cy="190" r="70" fill="#ffffff" opacity="0.07"/>
  <circle cx="360" cy="30" r="90" fill="#0f172a" opacity="0.10"/>
  <circle cx="330" cy="180" r="50" fill="#ffffff" opacity="0.06"/>
  <g filter="url(#ds)">
    <!-- baseball diamond faint -->
    <path d="M200 38 L262 100 L200 162 L138 100 Z" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3"/>
    <!-- database - SQL Server -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.97" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
      <path d="M138 72 C138 64 156 58 172 58 C188 58 206 64 206 72 L206 142 C206 150 188 156 172 156 C156 156 138 150 138 142 Z"/>
      <path d="M138 98 C138 106 156 112 172 112 C188 112 206 106 206 98"/>
      <path d="M138 122 C138 130 156 136 172 136 C188 136 206 130 206 122"/>
      <ellipse cx="172" cy="72" rx="34" ry="14"/>
    </g>
    <!-- stopwatch -->
    <circle cx="258" cy="112" r="30" fill="none" stroke="#ffffff" stroke-opacity="0.97" stroke-width="8"/>
    <line x1="258" y1="112" x2="258" y2="94" stroke="#ffffff" stroke-opacity="0.97" stroke-width="7" stroke-linecap="round"/>
    <line x1="258" y1="112" x2="272" y2="118" stroke="#ffffff" stroke-opacity="0.97" stroke-width="7" stroke-linecap="round"/>
    <line x1="258" y1="82" x2="258" y2="76" stroke="#ffffff" stroke-opacity="0.97" stroke-width="7" stroke-linecap="round"/>
    <text x="200" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#ffffff" opacity="0.95">DUGOUT</text>
  </g>
</svg>
