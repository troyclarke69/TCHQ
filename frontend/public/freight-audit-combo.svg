<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.55" stop-color="#d97706"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="400" height="225" fill="url(#bg)"/>
  <circle cx="60" cy="190" r="70" fill="#ffffff" opacity="0.07"/>
  <circle cx="360" cy="30" r="90" fill="#0f172a" opacity="0.10"/>
  <circle cx="330" cy="180" r="50" fill="#ffffff" opacity="0.06"/>

  <g filter="url(#ds)">
    <!-- truck -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
      <rect x="78" y="78" width="132" height="66" rx="6"/>
      <line x1="78" y1="110" x2="210" y2="110" stroke-width="4" opacity="0.7"/>
      <path d="M210 98 h44 l24 26 v20 h-68 z"/>
      <rect x="222" y="106" width="20" height="16" rx="2"/>
      <circle cx="122" cy="150" r="17" fill="#0f172a" fill-opacity="0.25" stroke-width="6"/>
      <circle cx="252" cy="150" r="17" fill="#0f172a" fill-opacity="0.25" stroke-width="6"/>
      <line x1="60" y1="167" x2="300" y2="167" stroke-width="4" opacity="0.5"/>
    </g>

    <!-- big audit checkmark, stamped directly over the truck -->
    <path d="M140 118 l32 34 100 -84" fill="none" stroke="#ffffff" stroke-opacity="0.97"
          stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
