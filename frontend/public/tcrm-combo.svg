    </g>
    <circle cx="200" cy="114" r="18" fill="#ffffff" fill-opacity="0.97"/>
    <g stroke="#1d4ed8" stroke-opacity="0.4" stroke-width="3.5" stroke-linecap="round">
      <line x1="194" y1="105" x2="194" y2="123"/>
      <line x1="200" y1="103" x2="200" y2="125"/>
      <line x1="206" y1="105" x2="206" y2="123"/>
    </g>
    
