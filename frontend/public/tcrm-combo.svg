      <line x1="272" y1="146" x2="208" y2="118"/>
    </g>
    <g stroke="#ffffff" stroke-opacity="0.97" stroke-width="9" stroke-linecap="round">
      <line x1="148" y1="130" x2="138" y2="150"/>
